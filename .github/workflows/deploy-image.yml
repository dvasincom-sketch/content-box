name: Build image

# ОТКЛЮЧЕНО от авто-запуска. Timeweb снова собирает образ из исходников
# (docker-compose.yml → build:), поэтому сборка образа в CI и автопин не нужны.
# Оставлено только ручным запуском (workflow_dispatch) на случай возврата к
# схеме с готовым образом из GHCR.
on:
  workflow_dispatch: {}

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Логин в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Сборка и пуш образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            S3_PUBLIC_URL=${{ vars.S3_PUBLIC_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/content-box:latest
            ghcr.io/${{ github.repository_owner }}/content-box:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
