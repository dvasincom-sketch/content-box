name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Логин в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Сборка и пуш образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            S3_PUBLIC_URL=${{ vars.S3_PUBLIC_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/content-box:latest
            ghcr.io/${{ github.repository_owner }}/content-box:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Триггер деплоя Timeweb
        env:
          HOOK: ${{ secrets.TIMEWEB_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            echo "Дёргаю деплой-хук Timeweb…"
            curl -fsS -X POST "$HOOK"
          else
            echo "TIMEWEB_DEPLOY_HOOK не задан — пропускаю."
          fi
