name: Nightly

# Ночной полный прогон. Дополняет CI (тот на каждый push гоняет типы/линт/
# юниты/сборку БЕЗ базы). Здесь поднимается настоящий Postgres, накатываются
# миграции и запускаются ИНТЕГРАЦИОННЫЕ тесты — то, что в push-CI не гоняется.
#
# Запуск ночью, когда активность минимальна, плюс кнопка «Run workflow» во
# вкладке Actions (ручной запуск, как «Build Now» в Jenkins). При падении
# заводится задача с меткой nightly-failure (баг-трекер), при зелёном прогоне
# она автоматически закрывается. Настрой на Projects-борде Auto-add для issues
# с этой меткой — и падения будут сами попадать на доску.
#
# e2e (Playwright) добавляются отдельным шагом позже: им нужен посеянный
# активный тенант и суперадмин, это отдельный харнесс.

on:
  schedule:
    # 00:00 UTC = 03:00 по Москве (UTC+3). Ночь, минимальная активность.
    - cron: '0 0 * * *'
  workflow_dispatch: {}

# Один ночной прогон за раз; промежуточный запуск не отменяем.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # issues: write — чтобы падение ночного прогона могло завести/обновить
    # задачу в баг-трекере встроенным GITHUB_TOKEN, без внешнего PAT.
    permissions:
      contents: read
      issues: write

    # Настоящий Postgres как сервис-контейнер. GitHub ждёт health-check, прежде
    # чем начать шаги, поэтому миграции и int-тесты видят готовую базу.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: contentbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d contentbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/contentbox
      PAYLOAD_SECRET: ci-nightly-not-a-real-secret
      # Публичный URL хранилища нужен сборке для images.remotePatterns (не секрет).
      S3_PUBLIC_URL: https://s3.twcstorage.ru/ci
      # Meili не поднимаем: поиск опционален и при пустых переменных отключается.
      MEILI_HOST: ''
      MEILI_MASTER_KEY: ''

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      # npm install, а не npm ci: lock сгенерирован на macOS/Node 22, на
      # Linux/Node 20 npm ci считает его out of sync (та же причина, что в CI и
      # Dockerfile).
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Миграции (на сервисный Postgres)
        run: npm run migrate

      - name: Типы
        run: npx tsc --noEmit

      - name: Линт
        run: npm run lint

      - name: Юнит-тесты
        run: npm run test:unit

      - name: Интеграционные тесты
        run: npm run test:int

      - name: Сборка
        run: npm run build

      # ── Баг-трекер ───────────────────────────────────────────────────────
      # Падение → одна «катящаяся» задача с меткой nightly-failure: если открытая
      # уже есть — добавляем комментарий (не плодим дубли), иначе создаём. Зелёный
      # прогон закрывает её. На Projects-борде включи Auto-add по этой метке.
      - name: Падение → задача в баг-трекер
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const label = 'nightly-failure'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const short = context.sha.slice(0, 7)

            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label })
            } catch {
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: 'B60205',
                description: 'Падение ночного прогона (Nightly CI)',
              })
            }

            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label, per_page: 1,
            })

            if (open.data.length) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: open.data[0].number,
                body: `Снова упало: ${runUrl} (коммит ${short}).`,
              })
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: '🌙 Ночной прогон упал',
                labels: [label],
                body: [
                  'Ночной прогон **Nightly** завершился с ошибкой.',
                  '',
                  `- Прогон: ${runUrl}`,
                  `- Коммит: ${context.sha}`,
                  '',
                  'Открой прогон, чтобы увидеть упавший шаг (миграции / типы / линт / юниты / интеграционные / сборка).',
                  'Задача закроется сама, когда ночной прогон снова станет зелёным.',
                ].join('\n'),
              })
            }

      - name: Зелёно → закрыть задачу о падении
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const label = 'nightly-failure'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label, per_page: 20,
            })
            for (const iss of open.data) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: iss.number,
                body: `✅ Ночной прогон снова зелёный: ${runUrl}. Закрываю.`,
              })
              await github.rest.issues.update({
                ...context.repo, issue_number: iss.number, state: 'closed',
              })
            }
