name: Черновик /update (Asya)

# Раз в сутки собирает коммиты за вчера, отдаёт их Asya, вставляет готовую запись
# в public/update.html и открывает Pull Request. Человек только ревьюит и мержит.

on:
  schedule:
    # 06:07 UTC = 09:07 МСК. Минуту сдвинули с :00 — расписания Actions на ровном
    # часе часто задерживаются под нагрузкой.
    - cron: '7 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'День в формате YYYY-MM-DD (пусто = вчера по МСК)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Moscow
    steps:
      - name: Checkout (полная история — нужна для git log за вчера)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Определить день
        id: day
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DAY="${{ github.event.inputs.date }}"
          else
            DAY="$(date -d 'yesterday' +%F)"
          fi
          echo "value=$DAY" >> "$GITHUB_OUTPUT"
          echo "День: $DAY"

      - name: Собрать черновик через Asya
        id: draft
        env:
          ASYA_API_URL: https://api.xn--80a8a2b.online
          ASYA_API_KEY: ${{ secrets.ASYA_API_KEY }}
        run: node scripts/changelog-asya.mjs "${{ steps.day.outputs.value }}"

      - name: Открыть Pull Request
        if: steps.draft.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "changelog: ${{ steps.draft.outputs.version }} — ${{ steps.draft.outputs.title }}"
          branch: "changelog/${{ steps.day.outputs.value }}"
          delete-branch: true
          title: "Обновление /update: ${{ steps.draft.outputs.version }} — ${{ steps.draft.outputs.title }}"
          body: |
            Автоматический черновик записи для журнала обновлений за **${{ steps.day.outputs.value }}**.

            Собрала Asya из коммитов дня, вставлено в начало массива `RELEASES`
            в `public/update.html`.

            Проверь перед мержем:
            - формулировки — польза для авторов, без техножаргона;
            - число К в версии `${{ steps.draft.outputs.version }}` (по умолчанию — следующий релиз дня);
            - теги и нужен ли блок «Для авторов».

            Если день пустой или только служебные правки — этот PR не создаётся.
          labels: changelog
          add-paths: |
            public/update.html
