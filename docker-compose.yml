# Timeweb App Platform — Docker Compose деплой.
#
# Все переменные задаются в панели Timeweb (раздел «Переменные»). Здесь они явно
# пробрасываются в сервис app через ${...} — чтобы контейнер приложения гарантированно
# их получил (в compose панельные env не всегда инжектятся во все сервисы сами).
#
# Ограничения App Platform: на домен проксируется первый сервис (app);
# meilisearch — внутренний (без ports); persistent volumes запрещены, поэтому
# индекс Meili эфемерный и перестраивается на старте приложения (см. plugin.ts).

services:
  app:
    build:
      context: .
      args:
        - R2_PUBLIC_URL=${R2_PUBLIC_URL}
    ports:
      - '3000:3000'
    environment:
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      DATABASE_URL: ${DATABASE_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      KINESCOPE_API_TOKEN: ${KINESCOPE_API_TOKEN}
      KINESCOPE_PARENT_ID: ${KINESCOPE_PARENT_ID}
      RUSENDER_API_TOKEN: ${RUSENDER_API_TOKEN}
      RUSENDER_API_KEY_ID: ${RUSENDER_API_KEY_ID}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      CRON_SECRET: ${CRON_SECRET}
    depends_on:
      - meilisearch
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
    restart: unless-stopped
