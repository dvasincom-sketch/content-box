# Timeweb App Platform — Docker Compose.
#
# ${...} подставляется Timeweb'ом из панели «Переменные» — это рабочий механизм
# (при заданных переменных `payload migrate` проходит). Значения задаются в панели;
# здесь они пробрасываются в контейнеры через ${...}.
#
# meilisearch виден приложению как http://meilisearch:7700 (внутренняя сеть).

services:
  app:
    # Timeweb собирает образ ИЗ ИСХОДНИКОВ на каждом деплое (по Dockerfile).
    # Осознанный выбор прозрачности: деплой дольше (next build ~2-3 мин + короткое
    # окно на подмене контейнера), НО панель Timeweb всегда отражает реальный код
    # из репозитория и правки гарантированно приезжают. Схема с готовым образом
    # из GHCR (image: + pull_policy) на практике оказалась непрозрачной: Timeweb
    # не перечитывал теги и деплоил старый образ.
    # S3_PUBLIC_URL/R2_PUBLIC_URL вшиваются в сборку (next.config images.remotePatterns)
    # — подставляются Timeweb'ом из панели «Переменные».
    build:
      context: .
      target: app
      args:
        - S3_PUBLIC_URL=${S3_PUBLIC_URL}
        - R2_PUBLIC_URL=${R2_PUBLIC_URL}
    ports:
      - '3000:3000'
    environment:
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      DATABASE_URL: ${DATABASE_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      # Объектное хранилище S3 (Timeweb Cloud). Значения — из панели «Переменные».
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      # Legacy Cloudflare R2 — фолбэк на время перехода (можно убрать позже).
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      KINESCOPE_API_TOKEN: ${KINESCOPE_API_TOKEN}
      KINESCOPE_PARENT_ID: ${KINESCOPE_PARENT_ID}
      RUSENDER_API_TOKEN: ${RUSENDER_API_TOKEN}
      RUSENDER_API_KEY_ID: ${RUSENDER_API_KEY_ID}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      CRON_SECRET: ${CRON_SECRET}
      # Своё видеохранилище (Фаза 1): секрет HMAC для webhook воркера и секрет
      # подписи JWT для плейбэка HLS. Заданы в панели «Переменные» Timeweb.
      VIDEO_WEBHOOK_SECRET: ${VIDEO_WEBHOOK_SECRET:-}
      VIDEO_JWT_SECRET: ${VIDEO_JWT_SECRET:-}
      # Ася-саммари видео (внешний сервис). Ключ — секрет, дёргаем сервер-к-серверу.
      ASYA_SUMMARY_URL: ${ASYA_SUMMARY_URL:-https://xn--80a8a2b.online/api/summary}
      ASYA_SUMMARY_KEY: ${ASYA_SUMMARY_KEY:-}
      # Сервисный ключ VK для валидатора видео (video.get). Пусто — VK не проверяется.
      VK_SERVICE_TOKEN: ${VK_SERVICE_TOKEN:-}
      # Веб-аналитика Umami (runtime). Читаются серверным кодом при рендере:
      # UMAMI_SCRIPT_URL — трекер во фронт-layout; UMAMI_API_URL + токен/логин —
      # чтение агрегатов в /studio/analytics. Сам реверс-прокси домена на
      # http://umami:3000 задан в next.config (rewrites), env для него не нужен.
      UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
      UMAMI_STUDIO_WEBSITE_ID: ${UMAMI_STUDIO_WEBSITE_ID:-}
      UMAMI_API_URL: ${UMAMI_API_URL:-}
      UMAMI_API_TOKEN: ${UMAMI_API_TOKEN:-}
      UMAMI_API_USER: ${UMAMI_API_USER:-}
      UMAMI_API_PASSWORD: ${UMAMI_API_PASSWORD:-}
      # Listmonk (рассылки): чтение статистики выпусков и отправка дайджеста
      # кампанией. Внутренний адрес сервиса listmonk. Без этих переменных
      # приложение НЕ видит Listmonk (Timeweb пробрасывает только объявленное здесь).
      LISTMONK_API_URL: ${LISTMONK_API_URL:-http://listmonk:9000}
      LISTMONK_API_USER: ${LISTMONK_API_USER:-}
      LISTMONK_API_TOKEN: ${LISTMONK_API_TOKEN:-}
      LISTMONK_FROM_EMAIL: ${LISTMONK_FROM_EMAIL:-noreply@contentbox.site}
      # SMS-вход/регистрация авторов (sms.ru). Без SMSRU_API_ID роут OTP
      # отдаёт «Вход по SMS недоступен». Timeweb пробрасывает только то,
      # что объявлено здесь, — значения задаются в панели «Переменные».
      SMSRU_API_ID: ${SMSRU_API_ID:-}
      SMSRU_FROM: ${SMSRU_FROM:-}
    depends_on:
      # service_started, а НЕ service_healthy — сознательно.
      #
      # Поиск в этом проекте опциональная подсистема: при недоступном
      # Meilisearch приложение работает, просто /search и подсказки пусты
      # (isMeiliConfigured в src/search/plugin.ts именно для этого написан).
      # С condition: service_healthy короткий MEILI_MASTER_KEY, битый том или
      # OOM у Meili клали бы ВЕСЬ САЙТ — опциональная зависимость становится
      # блокирующей. Healthcheck ниже всё равно полезен для наблюдаемости.
      meilisearch:
        condition: service_started
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
    # Порт 7700 наружу НЕ публикуем: приложение ходит по внутренней сети.
    volumes:
      # Без тома индекс эфемерный и теряется на каждом рестарте и редеплое.
      # Компенсировалось полным реиндексом из Postgres на старте
      # (src/search/plugin.ts), но с ростом базы это дорогая операция на каждый
      # подъём контейнера. Том был в docker-compose.meili.yml, а в боевой файл
      # не доехал — эти два файла разошлись.
      - meili_data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:7700/health']
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    mem_limit: 1g
    restart: unless-stopped

  # --- Веб-аналитика: self-hosted Umami ---
  # Umami сам отдаёт /script.js и /api и САМ накатывает свою схему в БД при старте.
  # ВАЖНО (Timeweb App Platform):
  #  1) домен получает ТОЛЬКО первый сервис (app) — поэтому наружу umami НЕ
  #     публикуем; трафик analytics.contentbox.site заворачивает сам `app`
  #     реверс-прокси на внутренний http://umami:3000 (next.config.ts rewrites +
  #     src/proxy.ts). По внутренней сети compose umami доступен по имени сервиса.
  #  2) ТОМА НЕ ПЕРСИСТЕНТНЫ — окружение пересоздаётся на каждый деплой, данные
  #     контейнеров стираются. Поэтому БД Umami держим во ВНЕШНЕЙ managed-Postgres
  #     (отдельная база `umami`), а контейнера umami-db с томом больше нет — иначе
  #     аналитика (и пароль админа) обнулялись бы каждый деплой.
  # UMAMI_DATABASE_URL и UMAMI_APP_SECRET задаются в панели Timeweb «Переменные».
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      DATABASE_URL: ${UMAMI_DATABASE_URL}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
      # Prisma 7 (JS-драйвер pg) строго проверяет TLS-цепочку и отвергает
      # сертификат managed-Postgres Timeweb («self-signed certificate in chain»),
      # из-за чего Umami падает в 500, хотя app (node-postgres) и Listmonk (Go)
      # к той же базе с sslmode=require подключаются. Отключаем проверку цепочки
      # ТОЛЬКО у Umami — соединение остаётся шифрованным. Затрагивает лишь этот
      # вторичный контейнер, app не касается.
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    mem_limit: 512m
    restart: unless-stopped

  # --- Рассылки/новостники: self-hosted Listmonk ---
  # Те же правила Timeweb, что у Umami:
  #  1) наружу порт НЕ публикуем — домен lists.contentbox.site заворачивает `app`
  #     реверс-прокси на внутренний http://listmonk:9000 (next.config.ts + proxy.ts);
  #  2) БД — ВНЕШНЯЯ managed-Postgres (ОТДЕЛЬНАЯ база `listmonk`), тома нет.
  # command: идемпотентно ставит/обновляет схему в managed-БД при старте и
  # запускает сервер (`--config ''` = конфиг только из env). Схема живёт в БД,
  # поэтому эфемерность контейнера не страшна.
  # Первый суперадмин — LISTMONK_ADMIN_USER/PASSWORD (панель Timeweb).
  # SMTP настраивается ПОЗЖЕ прямо в UI Listmonk (Settings → SMTP), без передеплоя.
  # ВАЖНО: LISTMONK_db__host — тот же ВНУТРЕННИЙ хост managed-Postgres, что у app
  # (НЕ публичный *.twc1.net — из контейнера он недостижим, это и есть текущая
  # ошибка Umami P1001). База `listmonk` должна быть создана на инстансе заранее.
  listmonk:
    image: listmonk/listmonk:latest
    command: ["sh", "-c", "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''"]
    environment:
      LISTMONK_app__address: "0.0.0.0:9000"
      TZ: "Europe/Moscow"
      LISTMONK_db__host: ${LISTMONK_DB_HOST}
      LISTMONK_db__port: ${LISTMONK_DB_PORT:-5432}
      LISTMONK_db__user: ${LISTMONK_DB_USER}
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD}
      LISTMONK_db__database: ${LISTMONK_DB_NAME:-listmonk}
      LISTMONK_db__ssl_mode: ${LISTMONK_DB_SSLMODE:-require}
      # ЖЁСТКО ограничиваем пул: managed-Postgres общий с app, у него небольшой
      # max_connections. По умолчанию Listmonk открывает ~25+25 соединений и
      # исчерпывал лимит → падал ВЕСЬ app и сайты тенантов (P1001). 4+2 хватает.
      LISTMONK_db__max_open: ${LISTMONK_DB_MAXOPEN:-4}
      LISTMONK_db__max_idle: ${LISTMONK_DB_MAXIDLE:-2}
      LISTMONK_db__max_lifetime: "300s"
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER:-}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD:-}
    mem_limit: 512m
    restart: unless-stopped

  # --- Транскод-воркер собственного видеохранилища (Фаза 1, VOD) ---
  # ТОТ ЖЕ образ, что и app (build: context: .) — в нём уже есть node_modules и
  # ffmpeg (см. Dockerfile). Отличие только в command: вместо next start гоняем
  # worker/transcode.mjs. Отдельный сервис, чтобы тяжёлый ffmpeg НЕ душил веб.
  #
  # Поллит таблицу video_jobs (FOR UPDATE SKIP LOCKED), гонит HLS ABR, заливает
  # артефакты в S3 и шлёт подписанный webhook в app по внутренней сети
  # (http://app:3000). Пул к БД маленький (max=2) — managed-Postgres общий с app.
  #
  # ВНИМАНИЕ (Timeweb): сервис должен собираться из исходников так же, как app.
  # Если платформа собирает ТОЛЬКО первый сервис — воркер не поднимется; тогда
  # запускаем его как отдельное приложение Timeweb на том же репозитории со
  # start-командой `node worker/transcode.mjs`, либо временно в app-контейнере.
  worker:
    build:
      context: .
      target: worker
      args:
        - S3_PUBLIC_URL=${S3_PUBLIC_URL}
        - WHISPER_MODEL=${WHISPER_MODEL:-small}
        - WHISPER_MODEL_URL=${WHISPER_MODEL_URL:-}
        - WHISPER_IMAGE=${WHISPER_IMAGE:-whisper-build}
        - R2_PUBLIC_URL=${R2_PUBLIC_URL}
    command: ["node", "worker/transcode.mjs"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      # Легаси-имена R2_*: приложение читает бакет/эндпоинт как `S3_* || R2_*`,
      # и в панели значения могут лежать под R2_*. Пробрасываем их и воркеру,
      # иначе он видит пустой S3_BUCKET → «No value provided for input HTTP label: Bucket».
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      VIDEO_WEBHOOK_SECRET: ${VIDEO_WEBHOOK_SECRET:-}
      APP_INTERNAL_URL: http://app:3000
      POLL_INTERVAL_MS: ${VIDEO_POLL_INTERVAL_MS:-5000}
      MAX_ATTEMPTS: ${VIDEO_MAX_ATTEMPTS:-3}
      WORKER_HEALTH_PORT: "3001"
      # Авто-субтитры (whisper.cpp). Бинарник и модель уже в образе (Dockerfile);
      # здесь только тумблер и параметры. WHISPER_ENABLED=0 — выключить.
      WHISPER_ENABLED: ${WHISPER_ENABLED:-1}
      WHISPER_LANG: ${WHISPER_LANG:-ru}
      # Пусто → воркер берёт все ядра CPU (worker/transcode.mjs). Число в панели ограничивает.
      WHISPER_THREADS: ${WHISPER_THREADS:-}
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-/opt/models/ggml-small.bin}
      WHISPER_TIMEOUT_MS: ${WHISPER_TIMEOUT_MS:-7200000}
      # Длинное аудио режется на чанки: размер чанка и таймаут на чанк (пусто → дефолты кода: 15 мин / 30 мин).
      WHISPER_CHUNK_SEC: ${WHISPER_CHUNK_SEC:-}
      WHISPER_CHUNK_TIMEOUT_MS: ${WHISPER_CHUNK_TIMEOUT_MS:-}
    # ПЕРЕОПРЕДЕЛЯЕМ healthcheck из Dockerfile (там curl :3000/api/health — веб
    # приложения). У воркера веб-сервера на 3000 нет, поэтому тот healthcheck
    # падал и оркестратор убивал контейнер каждые ~7 мин ПОСРЕДИ транскода.
    # Здесь проверяем лёгкий health-эндпоинт самого воркера.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3001/']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      app:
        condition: service_started
    mem_limit: 2g
    restart: unless-stopped

volumes:
  meili_data:
