# Timeweb App Platform — Docker Compose.
#
# ВАЖНО: Timeweb вставляет переменные из панели напрямую в контейнеры, но НЕ
# подставляет их в ${...} внутри этого файла. Поэтому здесь НЕ используем ${...}
# для панельных переменных — иначе пустая интерполяция перетирает реальные значения.
# Всё (DATABASE_URL, PAYLOAD_SECRET, R2_*, KINESCOPE_*, RUSENDER_*, MEILI_MASTER_KEY, ...)
# задаётся в панели Timeweb и инжектится в оба контейнера автоматически.
#
# Здесь только КОНСТАНТЫ:
#  - app.MEILI_HOST — внутренний адрес Meili (имя сервиса в compose-сети);
#  - meilisearch.MEILI_ENV / MEILI_NO_ANALYTICS — режим Meili.

services:
  app:
    build:
      context: .
    ports:
      - '3000:3000'
    environment:
      MEILI_HOST: http://meilisearch:7700
    depends_on:
      - meilisearch
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
    restart: unless-stopped
