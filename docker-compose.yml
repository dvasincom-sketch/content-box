# Timeweb App Platform — Docker Compose деплой (заменяет старый template-compose).
#
# Ограничения App Platform, учтённые здесь:
#  - На домен проксируется ТОЛЬКО первый сервис (app). meilisearch — без ports,
#    виден приложению внутри compose-сети по имени `meilisearch:7700`, наружу не торчит.
#  - Persistent volumes ЗАПРЕЩЕНЫ → у Meili нет тома, индекс эфемерный. Приложение
#    само перестраивает его на старте, если пусто (src/search/plugin.ts onInit).
#  - env задаются в панели Timeweb; в compose — только интерполяция ${...}.
#    (DATABASE_URL, PAYLOAD_SECRET, R2_*, KINESCOPE_*, RUSENDER_* — из панели.)
#
# В панели добавь новую переменную: MEILI_MASTER_KEY = <openssl rand -base64 48>.
# MEILI_HOST задавать в панели НЕ нужно — он зашит в сервис app ниже.

services:
  app:
    build:
      context: .
      args:
        - R2_PUBLIC_URL=${R2_PUBLIC_URL}
    ports:
      - '3000:3000'
    environment:
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    depends_on:
      - meilisearch
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
    restart: unless-stopped
